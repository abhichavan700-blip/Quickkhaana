<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickKhaana - Bijapur</title>
<style>
body{margin:0;font-family:Arial;background:#fff8f0}
.top{background:#ff3d00;color:#fff;padding:14px;text-align:center;font-weight:bold;position:sticky;top:0}
.banner{margin:12px;background:linear-gradient(135deg,#ff3d00,#ff8a00);color:#fff;border-radius:14px;padding:16px}
.card{background:#fff;margin:10px 12px;border-radius:12px;display:flex;box-shadow:0 2px 8px #0001;overflow:hidden}
.card img{width:100px;height:100px;object-fit:cover}
.info{padding:10px;flex:1}
.info h3{margin:0;font-size:14px}
.info p{margin:2px 0;font-size:11px;color:#666}
.price{color:#ff3d00;font-weight:bold}
.btn{background:#ff3d00;color:#fff;border:0;padding:6px 14px;border-radius:20px;float:right}
.cart{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.cart button{background:#25D366;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="top">quickkhaana - Bijapur | 30 min Delivery</div>
<div class="banner"><h2 style="margin:0">Bijapur ka Swad,<br>Ghar Tak! 🔥</h2><p style="margin:4px 0 0;font-size:12px">Fresh • Hot • Free Delivery</p></div>

<div class="card">
<img src="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=200">
<div class="info"><h3>Chicken Mandi Biryani</h3><p>Bijapur special dum biryani</p><div><span class="price">Rs 249</span><button class="btn" onclick="add(this,'Biryani',249)">Add</button></div></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=200">
<div class="info"><h3>Jowar Roti Thali</h3><p>2 Roti + Curry + Curd</p><div><span class="price">Rs 129</span><button class="btn" onclick="add(this,'Thali',129)">Add</button></div></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1603133872875-ca2a98a0c829?w=200">
<div class="info"><h3>Veg Fried Rice</h3><p>Chinese style fried rice</p><div><span class="price">Rs 99</span><button class="btn" onclick="add(this,'Fried Rice',99)">Add</button></div></div>
</div>

<div style="height:80px"></div>
<div class="cart"><div><b id="tot">Rs 0</b> - <span id="c">0 items</span><br><small id="l">Cart empty</small></div><button onclick="wa()">WhatsApp Order</button></div>

<script>
let t=0,items=[];
function add(b,n,p){items.push(n);t+=p;b.innerText='Added';document.getElementById('tot').innerText='Rs '+t;document.getElementById('c').innerText=items.length+' items';document.getElementById('l').innerText=items.join(', ')}
function wa(){if(!t){alert('Pehle Add karo bhai!');return}let m='QuickKhaana Order:%0A'+items.join('%0A')+'%0ATotal Rs '+t;window.open('https://wa.me/919999999999?text='+m,'_blank')}
</script>
</body>
</html>
